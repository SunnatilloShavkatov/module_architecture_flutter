name: module_architecture_mobile
version: 1.0.0+1
publish_to: "none"
description: "A new Flutter project."

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1
  # firebase
  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  # packages
  merge_dependencies:
    path: packages/merge_dependencies

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  analysis_lints: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/AppIcons.ttf

  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
